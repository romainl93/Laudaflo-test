<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laudaflo - Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  padding:16px;
  color:#183047;
}

h1{
  text-align:center;
  font-size:32px;
}

.card{
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:16px;
}

button{
  width:100%;
  padding:16px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-size:18px;
  background:#0b8d99;
  color:white;
}

input{
  box-sizing:border-box;
  width:100%;
  padding:15px;
  margin-top:10px;
  font-size:17px;
  border:1px solid #aaa;
  border-radius:10px;
}

#reader{
  width:100%;
}

#resultat{
  font-weight:bold;
  font-size:18px;
  margin-top:15px;
}

#message{
  margin-top:12px;
}
</style>
</head>

<body>

<h1>📦 Laudaflo</h1>

<div class="card">
  <h2>📷 Scanner un produit</h2>

  <div id="reader"></div>

  <button onclick="demarrerScanner()">Démarrer le scanner</button>
  <button onclick="arreterScanner()">Arrêter le scanner</button>

  <p id="message"></p>
</div>

<div class="card">
  <h2>Code-barres</h2>

  <input
    id="code"
    inputmode="numeric"
    placeholder="Numéro du code-barres">

  <button onclick="rechercher()">Rechercher le produit</button>

  <p id="resultat"></p>
</div>

<div class="card" id="association" style="display:none">

  <h2>Associer ce code</h2>

  <input
    id="produit"
    placeholder="Ex. Coca-Cola 33 cl">

  <button onclick="enregistrer()">
    Enregistrer le produit
  </button>

</div>

<script>

let scanner = null;
let scannerActif = false;
let dernierCode = "";

async function demarrerScanner(){

  const message =
    document.getElementById("message");

  try{

    if(scannerActif){
      return;
    }

    scanner =
      new Html5Qrcode("reader");

    const cameras =
      await Html5Qrcode.getCameras();

    if(!cameras || cameras.length === 0){
      message.textContent =
        "Aucune caméra détectée.";
      return;
    }

    let cameraId = cameras[0].id;

    if(cameras.length > 1){
      cameraId =
        cameras[cameras.length - 1].id;
    }

    await scanner.start(
      cameraId,
      {
        fps: 10,
        qrbox: {
          width: 280,
          height: 140
        }
      },
      codeDetecte,
      () => {}
    );

    scannerActif = true;

    message.textContent =
      "Caméra activée. Place le code-barres dans le cadre.";

  }catch(e){

    message.textContent =
      "Erreur caméra : " + e;

  }

}

function codeDetecte(code){

  document.getElementById("code").value =
    code;

  dernierCode = code;

  rechercher();

  arreterScanner();

}

async function arreterScanner(){

  if(scanner && scannerActif){

    try{
      await scanner.stop();
      await scanner.clear();
    }catch(e){}

  }

  scannerActif = false;

}

function rechercher(){

  const code =
    document.getElementById("code")
    .value.trim();

  if(!code){
    return;
  }

  dernierCode = code;

  const nom =
    localStorage.getItem(
      "produit_" + code
    );

  const resultat =
    document.getElementById("resultat");

  const association =
    document.getElementById("association");

  if(nom){

    resultat.textContent =
      "✅ Produit reconnu : " + nom;

    association.style.display =
      "none";

  }else{

    resultat.textContent =
      "⚠️ Code inconnu : " + code;

    association.style.display =
      "block";

  }

}

function enregistrer(){

  const nom =
    document.getElementById("produit")
    .value.trim();

  if(!nom || !dernierCode){
    return;
  }

  localStorage.setItem(
    "produit_" + dernierCode,
    nom
  );

  document.getElementById("produit").value =
    "";

  rechercher();

}

</script>

</body>
</html>
